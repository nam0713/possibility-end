<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Ending handover lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #04070b; overflow: hidden; }
  #universe-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<!--
  Real-engine continuity check for the ending film: the engine (src/universe/index.js, bundled
  privately with the current ending-film.js into ending-lab.engine.bundle.js) shows 'ending-ready',
  then Universe.ending.start() hands its exact particles to the film.
    node tools/build-universe.mjs --entry src/universe/index.js --out tools/lab/ending-lab.engine.bundle.js --dev
  ?layout=chapter|reading   ?start=1 (start the ending after 2.5 s)   ?arm=1 (arm the seed first, as the
  trigger's hover/focus does: Universe.ending.arm(true); the film continues the armed light)
-->
<canvas id="universe-canvas" aria-hidden="true"></canvas>
<script src="ending-lab.engine.bundle.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const U = window.Universe;
  U.mount(document.getElementById('universe-canvas'), { quality: q.get('quality') || 'high' });
  U.setScene('ending-ready', { layout: q.get('layout') || 'chapter', instant: true });
  if (q.get('arm') === '1' && U.ending.arm) U.ending.arm(true);
  window.__startEnding = () => U.ending.start({ origin: [0.5, 0.82] });
  if (q.get('start') === '1') setTimeout(() => window.__startEnding(), 2500);
</script>
</body>
</html>
